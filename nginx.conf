server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: https://*.tile.openstreetmap.org; frame-src https://www.youtube-nocookie.com; connect-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* ^/(?:\.|Dockerfile(?:/|$)|docker-compose\.ya?ml(?:/|$)|README(?:\.|/|$)|SECURITY_REVIEW\.md(?:/|$)|nginx\.conf(?:/|$)|\.github(?:/|$)) {
        return 404;
    }

    location ~* \.(?:zip|tar|tgz|gz|7z|sql|bak|log|env)$ {
        return 404;
    }
}
